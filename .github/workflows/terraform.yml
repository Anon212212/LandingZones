name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mocked provider – WAF guardrails)
        run: terraform test

      - name: firewall modules – terraform test (all vendors × HA modes)
        working-directory: modules/nva-firewall
        run: |
          terraform init -backend=false -input=false
          terraform test

      - name: client environments – validate + mocked plan
        run: |
          for env in environments/client-*/; do
            echo "::group::$env"
            terraform -chdir="$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$env" validate
            terraform -chdir="$env" test
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: designer tests (core + generated tfvars planned by terraform)
        run: |
          pip install -r gui/requirements-dev.txt
          python -m pytest gui/tests -q

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security-scan:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          # Report-only until accepted exceptions are recorded as
          # `#checkov:skip=<ID>:<reason>` next to the resource.
          soft_fail: true
